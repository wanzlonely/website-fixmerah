<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Auto Sender | Multi SMTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#0ea5e9', primaryDark: '#0284c7', dark: '#0f172a' }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .loader {
            border-top-color: transparent;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .tab-active { border-bottom: 2px solid #0ea5e9; color: #0ea5e9; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-primary selection:text-white">

    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer">
                    <i class="ph-fill ph-planet text-primary text-4xl mr-2"></i>
                    <span class="font-bold text-2xl tracking-tight text-dark">Fix<span class="text-primary">Merah</span></span>
                </div>
                <div class="flex space-x-8 items-center">
                    <button onclick="switchTab('sender')" id="tab-sender" class="tab-active pb-1 transition-colors">Sender</button>
                    <button onclick="switchTab('smtp')" id="tab-smtp" class="text-slate-600 pb-1 transition-colors">Data SMTP</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 pt-32 pb-20">
        
        <div id="view-sender" class="block">
            <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/50 p-12 border border-slate-100">
                <h3 class="text-3xl font-bold text-dark mb-2">Automated Target Sender</h3>
                <p class="text-slate-500 mb-8" id="status-info">Memeriksa ketersediaan SMTP...</p>
                
                <form id="senderForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Nama Pengirim</label>
                        <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email Target (Support)</label>
                        <input type="email" id="targetEmail" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                    </div>
                    
                    <button type="submit" id="submitBtn" class="w-full bg-primary hover:bg-primaryDark text-white font-semibold py-4 rounded-xl transition-all shadow-lg shadow-primary/30 hover:shadow-primary/50 flex items-center justify-center gap-2">
                        <span>Kirim Pesan Rotating</span>
                        <i class="ph-bold ph-paper-plane-right"></i>
                    </button>
                    
                    <div id="alertMsg" class="hidden mt-4 p-4 rounded-xl text-sm font-medium flex items-center gap-3"></div>
                </form>
            </div>
        </div>

        <div id="view-smtp" class="hidden">
            <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/50 p-12 border border-slate-100">
                <h3 class="text-3xl font-bold text-dark mb-2">Manajemen SMTP</h3>
                <p class="text-slate-500 mb-8">Tambahkan hingga 20 akun. Limit 15/hari per akun direst otomatis pukul 00:00 WIB.</p>
                
                <form id="smtpForm" class="flex gap-4 mb-10">
                    <input type="email" id="newSmtpEmail" placeholder="Alamat Email" required class="flex-1 px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-primary/50 outline-none">
                    <input type="text" id="newSmtpPass" placeholder="App Password" required class="flex-1 px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-primary/50 outline-none">
                    <button type="submit" class="bg-dark hover:bg-slate-800 text-white px-6 rounded-xl font-medium transition-all">Tambah</button>
                </form>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-500 text-sm">
                                <th class="pb-3 font-medium">Email Akun</th>
                                <th class="pb-3 font-medium">Penggunaan</th>
                                <th class="pb-3 font-medium">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="smtpList" class="text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const templates = [
            "Halo tim support, saya mengalami kendala pada akun saya. Mohon bantuan untuk meninjau kembali status akun saya secepatnya karena ini sangat penting bagi pekerjaan saya. Terima kasih.",
            "Hello support team, I am currently facing an issue with my account access. Please review my account status as soon as possible. Your prompt assistance is highly appreciated.",
            "Hola equipo de soporte, tengo problemas con mi cuenta. Les ruego que revisen el estado de mi cuenta lo antes posible. Gracias por su valiosa ayuda.",
            "Bonjour l'équipe d'assistance, je rencontre un problème avec mon compte. Veuillez vérifier l'état de mon compte dans les plus brefs délais. Merci beaucoup.",
            "Hallo Support-Team, ich habe ein Problem mit meinem Konto. Bitte überprüfen Sie meinen Kontostatus so schnell wie möglich. Vielen Dank im Voraus."
        ];

        function switchTab(tab) {
            document.getElementById('view-sender').classList.toggle('hidden', tab !== 'sender');
            document.getElementById('view-sender').classList.toggle('block', tab === 'sender');
            document.getElementById('view-smtp').classList.toggle('hidden', tab !== 'smtp');
            document.getElementById('view-smtp').classList.toggle('block', tab === 'smtp');
            
            document.getElementById('tab-sender').classList.toggle('tab-active', tab === 'sender');
            document.getElementById('tab-sender').classList.toggle('text-slate-600', tab !== 'sender');
            document.getElementById('tab-smtp').classList.toggle('tab-active', tab === 'smtp');
            document.getElementById('tab-smtp').classList.toggle('text-slate-600', tab !== 'smtp');
            
            if(tab === 'sender') updateStatusInfo();
        }

        function getWIBDate() {
            const now = new Date();
            const wibTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
            return wibTime.toISOString().split('T')[0];
        }

        function initData() {
            let accounts = JSON.parse(localStorage.getItem('smtpAccounts')) || [];
            let lastReset = localStorage.getItem('lastReset');
            const todayWIB = getWIBDate();

            if (lastReset !== todayWIB) {
                accounts = accounts.map(acc => ({ ...acc, count: 0 }));
                localStorage.setItem('smtpAccounts', JSON.stringify(accounts));
                localStorage.setItem('lastReset', todayWIB);
                localStorage.setItem('templateIndex', '0');
            }
            renderSmtpList();
            updateStatusInfo();
        }

        function renderSmtpList() {
            const accounts = JSON.parse(localStorage.getItem('smtpAccounts')) || [];
            const tbody = document.getElementById('smtpList');
            tbody.innerHTML = '';
            
            accounts.forEach((acc, index) => {
                const limitStatus = acc.count >= 15 ? 'text-red-500' : 'text-green-500';
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100';
                tr.innerHTML = `
                    <td class="py-4 text-dark font-medium">${acc.email}</td>
                    <td class="py-4 font-semibold ${limitStatus}">${acc.count} / 15</td>
                    <td class="py-4">
                        <button onclick="deleteSmtp(${index})" class="text-red-500 hover:text-red-700 p-2"><i class="ph-bold ph-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('smtpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const accounts = JSON.parse(localStorage.getItem('smtpAccounts')) || [];
            if (accounts.length >= 20) {
                alert('Maksimal 20 akun SMTP tercapai.');
                return;
            }
            const email = document.getElementById('newSmtpEmail').value;
            const pass = document.getElementById('newSmtpPass').value;
            
            accounts.push({ email, pass, count: 0 });
            localStorage.setItem('smtpAccounts', JSON.stringify(accounts));
            
            document.getElementById('smtpForm').reset();
            renderSmtpList();
            updateStatusInfo();
        });

        window.deleteSmtp = function(index) {
            const accounts = JSON.parse(localStorage.getItem('smtpAccounts')) || [];
            accounts.splice(index, 1);
            localStorage.setItem('smtpAccounts', JSON.stringify(accounts));
            renderSmtpList();
            updateStatusInfo();
        };

        function getAvailableSmtp() {
            const accounts = JSON.parse(localStorage.getItem('smtpAccounts')) || [];
            return accounts.find(acc => acc.count < 15) || null;
        }

        function updateStatusInfo() {
            const available = getAvailableSmtp();
            const statusEl = document.getElementById('status-info');
            const submitBtn = document.getElementById('submitBtn');
            
            if (available) {
                statusEl.innerHTML = `SMTP Aktif: <span class="font-semibold text-primary">${available.email}</span>`;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                const accounts = JSON.parse(localStorage.getItem('smtpAccounts')) || [];
                if (accounts.length === 0) {
                    statusEl.innerHTML = `<span class="text-red-500 font-semibold">Silakan tambahkan akun SMTP terlebih dahulu.</span>`;
                } else {
                    statusEl.innerHTML = `<span class="text-red-500 font-semibold">Semua akun mencapai limit harian. Tunggu reset besok pukul 00:00 WIB.</span>`;
                }
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        document.getElementById('senderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            initData();
            
            const smtp = getAvailableSmtp();
            if (!smtp) return;

            const submitBtn = document.getElementById('submitBtn');
            const alertMsg = document.getElementById('alertMsg');
            const originalBtnText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = `<div class="w-5 h-5 border-2 border-white rounded-full loader"></div> <span>Mengirim...</span>`;
            submitBtn.disabled = true;
            alertMsg.classList.add('hidden');

            let tIndex = parseInt(localStorage.getItem('templateIndex')) || 0;
            const message = templates[tIndex];

            const payload = {
                name: document.getElementById('name').value,
                targetEmail: document.getElementById('targetEmail').value,
                message: message,
                smtpUser: smtp.email,
                smtpPass: smtp.pass
            };

            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    let accounts = JSON.parse(localStorage.getItem('smtpAccounts'));
                    const targetAcc = accounts.find(a => a.email === smtp.email);
                    targetAcc.count += 1;
                    localStorage.setItem('smtpAccounts', JSON.stringify(accounts));

                    tIndex = (tIndex + 1) % templates.length;
                    localStorage.setItem('templateIndex', tIndex.toString());

                    alertMsg.className = 'mt-4 p-4 rounded-xl text-sm font-medium flex items-center gap-3 bg-green-50 text-green-700 border border-green-200';
                    alertMsg.innerHTML = `<i class="ph-fill ph-check-circle text-xl"></i> Sistem rotasi berhasil mengirim email.`;
                    
                    renderSmtpList();
                    updateStatusInfo();
                } else {
                    throw new Error('Gagal');
                }
            } catch (error) {
                alertMsg.className = 'mt-4 p-4 rounded-xl text-sm font-medium flex items-center gap-3 bg-red-50 text-red-700 border border-red-200';
                alertMsg.innerHTML = `<i class="ph-fill ph-warning-circle text-xl"></i> Transmisi ditolak. Kredensial tidak valid atau limit dari provider.`;
            } finally {
                alertMsg.classList.remove('hidden');
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        initData();
    </script>
</body>
</html>
