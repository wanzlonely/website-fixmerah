        :root{

            radial-gradient(800px 400px at 82% 0%, rgba(109,40,217,0.10), transparent 60%),
            radial-gradient(600px 400px at 50% 100%, rgba(124,58,237,0.06), transparent 70%),
            var(--base);
        }
        .app-bg:after{
          content:""; position:absolute; inset:0;

          background-size: 22px 22px;
          opacity:.35;

        }
        .card{
          background:var(--surface);
          border:1px solid var(--border);
          border-radius:24px;
          box-shadow: 0 20px 40px rgba(0,0,0,.06), 0 1px 0 rgba(255,255,255,.8) inset;
          animation: entrance .7s cubic-bezier(.16,1,.3,1);
        }
        @keyframes entrance{from{transform:translateY(12px); opacity:0} to{transform:translateY(0); opacity:1}}
        .kicker{
          display:inline-flex; align-items:center; gap:6px;
          font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.12em; font-weight:600;
          color:#6d28d9; background:rgba(109,40,217,.08); border:1px solid rgba(109,40,217,.14);
          padding:6px 10px; border-radius:999px;
        }
        .pill{
          display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px;
          border:1px solid var(--border); background:#fff; font-size:12px; font-weight:500;

        .pill-dot{width:7px; height:7px; border-radius:999px; background:var(--green); box-shadow:0 0 0 3px rgba(22,163,74,.15)}

        @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.5}}
        .auto-card{
          position:relative; overflow:hidden;

          padding:14px 14px 12px; transition: transform .2s, box-shadow .2s, border-color .2s;
        }
        .auto-card:hover{transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,0,0,.06); border-color:#ddd6fe}
        .auto-card:before{
          content:""; position:absolute; top:0; left:0; right:0; height:1px;

        }
        .inp{

          transition:border-color .18s, box-shadow .18s; color:var(--text);
        }
        .inp:focus{border-color:#c4b5fd; box-shadow:0 0 0 4px rgba(124,58,237,.12)}
        .inp::placeholder{color:#a1a1b5}
        .btn-dark{
          height:50px; border-radius:14px; background:#111013; color:#fff; font-family:"Space Grotesk",sans-serif;
          font-weight:600; font-size:14.5px; letter-spacing:-.01em; display:inline-flex; align-items:center; justify-content:center; gap:9px;
          box-shadow:0 10px 20px rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.1) inset;
          transition: transform .16s, box-shadow .16s, opacity .16s;
        }
        .btn-dark:hover{transform:translateY(-1px); box-shadow:0 14px 28px rgba(0,0,0,.16)}
        .btn-dark:active{transform:scale(.98)}
        .btn-dark:disabled{opacity:.5; pointer-events:none}
        .btn-purple{
          height:48px; border-radius:12px; background:linear-gradient(180deg, #7c3aed, #6d28d9);
          color:#fff; font-weight:600; font-size:14px; box-shadow:0 8px 18px rgba(109,40,217,.28);
          transition:transform .16s, box-shadow .16s;
        }
        .btn-purple:hover{transform:translateY(-1px); box-shadow:0 12px 24px rgba(109,40,217,.32)}
        .btn-purple:active{transform:scale(.98)}
        .icon-btn{
          width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:#fff;
          display:inline-flex; align-items:center; justify-content:center; color:#717184; transition:.18s;
        }
        .icon-btn:hover{border-color:#c4b5fd; color:#6d28d9; background:#faf5ff}
        .table-wrap{border:1px solid var(--border); border-radius:14px; overflow:hidden; background:#fff}
        table{width:100%; border-collapse:collapse}
        th{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.08em; color:#717184; font-weight:600; text-transform:uppercase; background:#f8f8fb; text-align:left; padding:12px 14px; border-bottom:1px solid var(--border)}

        .bar-i{height:100%; border-radius:999px; background:linear-gradient(90deg, #6d28d9, #7c3aed)}
        .badge{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.04em; padding:4px 8px; border-radius:999px; border:1px solid}

        .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:50; background:#18161f; color:#fff; font-size:13px; font-weight:500; padding:11px 16px; border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.18); animation:toastIn .36s cubic-bezier(.16,1,.3,1)}
