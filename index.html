<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIXMERAH WALZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:       #e11d48;
      --red-dk:    #be123c;
      --red-s:     rgba(225,29,72,.14);
      --red-glow:  rgba(225,29,72,.3);
      --orange:    #f97316;
      --amber:     #f59e0b;
      --bg:        #070709;
      --s1:        #0d0d10;
      --s2:        #141417;
      --s3:        #1a1a1f;
      --s4:        #212126;
      --b1:        rgba(255,255,255,.05);
      --b2:        rgba(255,255,255,.09);
      --b3:        rgba(255,255,255,.14);
      --text:      #f0f0f2;
      --text2:     #9090a0;
      --muted:     #50505f;
      --green:     #22c55e;
      --green-s:   rgba(34,197,94,.13);
      --blue:      #3b82f6;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:'DM Sans',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    #bg-canvas {
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(ellipse 60% 50% at 20% 10%, rgba(225,29,72,.09) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 85%, rgba(249,115,22,.06) 0%, transparent 55%),
        radial-gradient(ellipse 30% 30% at 50% 50%, rgba(225,29,72,.04) 0%, transparent 50%);
    }
    .grid-bg {
      position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.025;
      background-image:
        linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    #gate {
      position:fixed; inset:0; z-index:20;
      display:flex; align-items:center; justify-content:center; padding:16px;
    }
    .gate-card {
      position:relative; width:100%; max-width:420px;
      background:var(--s1); border:1px solid var(--b2); border-radius:28px;
      padding:44px 36px 36px; text-align:center;
      box-shadow:
        0 0 0 1px rgba(225,29,72,.06),
        0 32px 80px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.04);
      animation:slideUp .55s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(28px) scale(.96) }
      to   { opacity:1; transform:none }
    }
    .gate-card::after {
      content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:60%; height:1px;
      background:linear-gradient(90deg,transparent,rgba(225,29,72,.7),transparent);
    }

    .logo-zone { position:relative; width:120px; height:120px; margin:0 auto 28px; }
    .ring-outer {
      position:absolute; inset:-20px; border-radius:50%;
      border:1px dashed rgba(225,29,72,.2);
      animation:spin 16s linear infinite reverse;
    }
    .ring-outer::before, .ring-outer::after {
      content:''; position:absolute; border-radius:50%; background:var(--red);
      box-shadow:0 0 10px var(--red-glow);
    }
    .ring-outer::before { width:7px; height:7px; top:8px; left:50%; margin-left:-3.5px; }
    .ring-outer::after  { width:5px; height:5px; bottom:10px; right:14px; background:var(--orange); box-shadow:0 0 8px rgba(249,115,22,.5); }
    .ring-conic {
      position:absolute; inset:-11px; border-radius:50%;
      background:conic-gradient(from 0deg, var(--red) 0%, var(--orange) 20%, transparent 38%, transparent 100%);
      mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), white calc(100% - 2.5px));
      -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2.5px), white calc(100% - 2.5px));
      animation:spin 3s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg) } }
    .logo-glow {
      position:absolute; inset:-10px; border-radius:50%; z-index:1;
      background:radial-gradient(circle, rgba(225,29,72,.22) 0%, transparent 65%);
      animation:breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { transform:scale(1); opacity:.5 }
      50%      { transform:scale(1.15); opacity:1 }
    }
    .logo-wrap {
      position:absolute; inset:0; z-index:2; border-radius:50%; overflow:hidden;
      border:3px solid var(--s2);
      box-shadow:0 0 0 1.5px rgba(225,29,72,.45), 0 0 36px var(--red-s), 0 10px 28px rgba(0,0,0,.6);
      animation:float 4.5s ease-in-out infinite;
    }
    .logo-wrap img { width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    .brand-logo {
      width:34px; height:34px; border-radius:50%; overflow:hidden; flex-shrink:0;
      border:1.5px solid rgba(225,29,72,.4); box-shadow:0 0 12px rgba(225,29,72,.2);
    }
    .brand-logo img { width:100%; height:100%; object-fit:cover; }

    .gate-title {
      font-family:'Syne',sans-serif; font-size:26px; font-weight:900;
      letter-spacing:-.7px; margin-bottom:6px;
      background:linear-gradient(140deg, #fff 20%, #fecdd3 55%, var(--red) 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .gate-sub { font-size:13px; color:var(--text2); line-height:1.6; margin-bottom:28px; }

    .token-field-wrap {
      position:relative; margin-bottom:14px;
    }
    .token-input {
      width:100%; padding:15px 18px;
      background:var(--s2); border:1.5px solid var(--b3);
      border-radius:16px; color:var(--text);
      font-family:'JetBrains Mono', monospace; font-size:14px; letter-spacing:.06em;
      outline:none; text-align:center; text-transform:uppercase;
      transition:border-color .2s, box-shadow .2s, background .2s;
    }
    .token-input::placeholder { color:var(--muted); font-family:'DM Sans',sans-serif; letter-spacing:0; font-size:13px; }
    .token-input:focus {
      border-color:rgba(225,29,72,.5);
      box-shadow:0 0 0 4px rgba(225,29,72,.09);
      background:var(--s3);
    }
    .token-input.valid   { border-color:rgba(34,197,94,.5); box-shadow:0 0 0 4px rgba(34,197,94,.09); }
    .token-input.invalid { border-color:rgba(225,29,72,.5);  box-shadow:0 0 0 4px rgba(225,29,72,.09); }

    .field-hint-row {
      display:flex; align-items:center; justify-content:space-between;
      font-size:11.5px; color:var(--muted); margin-bottom:18px; padding:0 2px;
    }

    .btn {
      display:flex; align-items:center; justify-content:center; gap:9px;
      width:100%; padding:14px 20px; border:none; border-radius:14px;
      font-family:'DM Sans',sans-serif; font-weight:600; font-size:14.5px;
      cursor:pointer; text-decoration:none; margin-top:8px;
      transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, opacity .2s;
    }
    .btn:active { transform:scale(.97) !important; }
    .btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
    .btn-red {
      background:linear-gradient(135deg, var(--red-dk) 0%, var(--red) 50%, #f43f5e 100%);
      color:#fff; box-shadow:0 4px 24px rgba(225,29,72,.35), inset 0 1px 0 rgba(255,255,255,.15);
    }
    .btn-red:not(:disabled):hover { transform:translateY(-2px) scale(1.01); box-shadow:0 8px 32px rgba(225,29,72,.45); }
    .btn-ghost { background:var(--s2); color:var(--text2); border:1px solid var(--b3); }
    .btn-ghost:hover { background:var(--s3); color:var(--text); transform:translateY(-1px); }
    .btn-green {
      background:linear-gradient(135deg, #16a34a, var(--green));
      color:#fff; box-shadow:0 4px 20px rgba(34,197,94,.3);
    }
    .btn-green:not(:disabled):hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(34,197,94,.4); }

    .status-bar {
      display:flex; align-items:center; gap:10px;
      background:var(--s2); border:1px solid var(--b1); border-radius:12px;
      padding:11px 15px; margin-top:16px; font-size:12.5px; color:var(--text2);
    }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    .dot.checking { background:var(--amber);  animation:blink .5s infinite; }
    .dot.ok       { background:var(--green);  animation:blink 2s infinite; }
    .dot.error    { background:var(--red);    animation:blink .8s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    .bot-link-row {
      display:flex; align-items:center; justify-content:center; gap:6px;
      margin-top:14px; font-size:12px; color:var(--muted);
    }
    .bot-link-row a { color:var(--text2); text-decoration:none; font-weight:500; }
    .bot-link-row a:hover { color:var(--red); }

    .divider {
      display:flex; align-items:center; gap:12px; margin:20px 0 16px;
      font-size:11px; color:var(--muted); font-weight:500;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px; background:var(--b2);
    }

    #app { display:none; min-height:100vh; position:relative; z-index:1; }

    .topbar {
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 20px; height:58px;
      background:rgba(13,13,16,.9); backdrop-filter:blur(20px) saturate(160%);
      border-bottom:1px solid var(--b1);
    }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-name {
      font-family:'Syne',sans-serif; font-size:14.5px; font-weight:800; letter-spacing:-.3px;
      background:linear-gradient(135deg, #fff 40%, #fda4af);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .topbar-right { display:flex; align-items:center; gap:8px; }
    .access-chip {
      display:flex; align-items:center; gap:6px;
      background:var(--s3); border:1px solid var(--b2);
      border-radius:100px; padding:4px 12px 4px 7px; font-size:11.5px; color:var(--text2);
    }
    .access-chip .u-dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px rgba(34,197,94,.5); animation:blink 2.5s infinite; }
    .btn-xs {
      padding:5px 12px; border-radius:8px; font-family:'DM Sans',sans-serif;
      font-size:11.5px; font-weight:500; cursor:pointer;
      background:transparent; border:1px solid var(--b2); color:var(--text2); transition:.15s;
    }
    .btn-xs:hover { background:var(--s2); color:var(--text); }

    .page { display:none; max-width:680px; margin:0 auto; padding:28px 16px 80px; }
    .page.active { display:block; }
    .page-back {
      display:inline-flex; align-items:center; gap:6px;
      font-size:12.5px; color:var(--text2); cursor:pointer;
      background:none; border:none; padding:0; margin-bottom:18px; transition:color .15s;
    }
    .page-back:hover { color:var(--text); }
    .page-title { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; letter-spacing:-.4px; margin-bottom:6px; }
    .page-sub   { font-size:13px; color:var(--text2); line-height:1.6; margin-bottom:24px; }

    .welcome-box {
      background:linear-gradient(135deg, var(--s1) 0%, rgba(225,29,72,.04) 100%);
      border:1px solid var(--b2); border-radius:22px;
      padding:24px 26px; margin-bottom:20px; position:relative; overflow:hidden;
    }
    .welcome-box::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg, var(--red), var(--orange), transparent 70%);
    }
    .welcome-box h2 { font-family:'Syne',sans-serif; font-size:19px; font-weight:800; letter-spacing:-.3px; margin-bottom:5px; }
    .welcome-box p  { font-size:13px; color:var(--text2); line-height:1.55; }

    .info-pills { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .pill {
      display:inline-flex; align-items:center; gap:5px;
      font-size:11.5px; font-weight:600; padding:5px 12px; border-radius:100px;
    }
    .pill-green { background:var(--green-s); border:1px solid rgba(34,197,94,.22); color:#4ade80; }
    .pill-red   { background:var(--red-s);   border:1px solid rgba(225,29,72,.22);  color:#fb7185; }
    .pill-amber { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.22); color:#fbbf24; }

    .section-label { font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }

    .feat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:480px) { .feat-grid { grid-template-columns:1fr; } }
    .feat-card {
      background:var(--s1); border:1px solid var(--b1); border-radius:20px;
      padding:22px; cursor:pointer; position:relative; overflow:hidden;
      transition:border-color .25s, box-shadow .25s, transform .2s; user-select:none;
    }
    .feat-card:hover  { border-color:rgba(225,29,72,.28); box-shadow:0 12px 40px rgba(0,0,0,.4); transform:translateY(-3px); }
    .feat-card:active { transform:scale(.98); }
    .feat-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg, var(--red), var(--orange)); opacity:0; transition:opacity .25s;
    }
    .feat-card:hover::before { opacity:1; }
    .feat-icon {
      width:48px; height:48px; border-radius:13px; font-size:22px; margin-bottom:16px;
      background:linear-gradient(135deg, rgba(225,29,72,.1), rgba(249,115,22,.07));
      border:1px solid rgba(225,29,72,.16);
      display:flex; align-items:center; justify-content:center;
    }
    .feat-title { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; margin-bottom:5px; }
    .feat-desc  { font-size:12px; color:var(--text2); line-height:1.55; }
    .feat-badge {
      display:inline-flex; align-items:center; gap:5px; margin-top:12px;
      background:var(--red-s); border:1px solid rgba(225,29,72,.18);
      color:#fb7185; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:100px;
    }

    .panel { background:var(--s1); border:1px solid var(--b1); border-radius:20px; overflow:hidden; margin-bottom:14px; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid var(--b1); }
    .panel-head-title { font-family:'Syne',sans-serif; font-size:13.5px; font-weight:700; }
    .panel-body { padding:20px; }

    .field { margin-bottom:14px; }
    .field label { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:7px; letter-spacing:.01em; }
    .field input {
      width:100%; padding:12px 14px;
      background:var(--s2); border:1.5px solid var(--b2);
      border-radius:12px; color:var(--text); font-size:13.5px;
      font-family:'DM Sans',sans-serif; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    .field input:focus { border-color:rgba(225,29,72,.5); box-shadow:0 0 0 3px rgba(225,29,72,.09); }
    .field input::placeholder { color:var(--muted); }
    .field-hint { font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5; }

    .vbadge { display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:10px; font-size:12.5px; font-weight:500; margin-top:12px; border:1px solid transparent; }
    .vbadge.loading { background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.2); color:#fbbf24; }
    .vbadge.success { background:var(--green-s); border-color:rgba(34,197,94,.22); color:#4ade80; }
    .vbadge.fail    { background:var(--red-s);   border-color:rgba(225,29,72,.2);  color:#fb7185; }

    .chip { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 10px; border-radius:100px; }
    .chip-gray { background:var(--s3); border:1px solid var(--b2); color:var(--text2); }
    .chip-red  { background:var(--red-s); border:1px solid rgba(225,29,72,.2); color:#fb7185; }

    .email-list { display:flex; flex-direction:column; gap:10px; }
    .email-item { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--s2); border:1px solid var(--b1); border-radius:14px; padding:13px 16px; }
    .ei-left    { display:flex; align-items:center; gap:11px; min-width:0; flex:1; }
    .ei-avatar  { width:36px; height:36px; border-radius:10px; flex-shrink:0; background:linear-gradient(135deg,var(--red-dk),var(--red)); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .ei-addr    { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ei-stat    { font-size:11px; color:var(--text2); margin-top:2px; }
    .del-btn    { background:none; border:1px solid var(--b2); border-radius:8px; color:var(--text2); font-size:11.5px; padding:5px 10px; cursor:pointer; flex-shrink:0; transition:.15s; }
    .del-btn:hover { background:var(--red-s); border-color:rgba(225,29,72,.3); color:#fb7185; }

    .ae-card { display:flex; align-items:center; gap:12px; background:var(--s2); border:1px solid var(--b2); border-radius:16px; padding:15px; margin-bottom:16px; }
    .ae-icon  { width:42px; height:42px; border-radius:12px; flex-shrink:0; background:linear-gradient(135deg,var(--red-dk),var(--red)); color:#fff; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .ae-info  { min-width:0; flex:1; }
    .ae-addr  { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ae-quota { font-size:11px; color:var(--text2); margin-top:2px; }
    .qbar     { height:3px; background:var(--s3); border-radius:100px; margin-top:8px; overflow:hidden; }
    .qfill    { height:100%; border-radius:100px; background:linear-gradient(90deg,var(--green),var(--orange)); transition:width .4s; }
    .qfill.full { background:linear-gradient(90deg,var(--orange),var(--red)); }

    .lang-tabs { display:flex; gap:7px; margin-bottom:14px; flex-wrap:wrap; }
    .lang-tab { padding:7px 15px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--b2); background:var(--s2); color:var(--text2); transition:.15s; }
    .lang-tab.active { background:linear-gradient(135deg,var(--red-dk),var(--red)); border-color:transparent; color:#fff; }

    .tpl-box { background:var(--s2); border:1px solid var(--b1); border-radius:12px; padding:14px 16px; font-size:12px; color:var(--text2); line-height:1.7; white-space:pre-wrap; margin-bottom:16px; font-family:'JetBrains Mono',monospace; }

    .send-result { background:var(--s2); border:1px solid var(--b1); border-radius:14px; padding:16px; margin-top:12px; display:none; }
    .send-result.show { display:block; }
    .send-ok   { color:#4ade80; font-weight:600; font-size:14px; }
    .send-fail { color:#fb7185; font-weight:600; font-size:14px; }
    .send-det  { font-size:12px; color:var(--text2); margin-top:6px; line-height:1.55; }

    .alert-err { display:flex; align-items:flex-start; gap:10px; padding:13px 16px; border-radius:12px; font-size:13px; font-weight:500; margin-bottom:16px; background:var(--red-s); border:1px solid rgba(225,29,72,.2); color:#fb7185; }

    .empty-box { text-align:center; padding:36px 20px; color:var(--muted); font-size:13px; }
    .empty-box .eico { font-size:34px; margin-bottom:10px; }

    .spin { animation:spin .7s linear infinite; display:inline-block; }

    .token-display {
      background:var(--s3); border:1px solid var(--b1); border-radius:10px;
      padding:9px 14px; margin-top:6px;
      font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
      letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .token-display .tok-val { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .copy-btn { back
